<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Todo List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
                <style>
                            @import url('https://fonts.cdnfonts.com/css/minecraft-4');
</style>
                
</head>

<body>
    <header>
        <h1>My Todo List</h1>
    </header>

    <div id="form">
        <input id="text" placeholder="Add an item…" />
        <button id="add-item-button">Add</button>
    </div>

    <div class="toolbar">
        <button id="sort">Sort A–Z</button>
        <button id="clear">Clear All</button>
    </div>

    <ul id="list">
    </ul>

<img id="img-bread" src="bread.webp" alt="Bread" style="display: none;">

<img id="img-soup" src="soup.webp" alt="Soup" style="display: none;">

<img id="img-mutton" src="mutton.webp" alt="Mutton" style="display: none;">


    <script src="script.js"></script>
</body>

</html>
